{% extends "base.html" %}
{% block title %}Delete Job | Job Portal{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="card" style="text-align: center;">
        <div style="background: #FEE2E2; width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 1.5rem auto; display: flex; align-items: center; justify-content: center; color: #DC2626;">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18"></path>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        </div>
        
        <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem; color: #111827;">Delete Job Post?</h1>
        <p style="margin-bottom: 2rem;">Are you sure you want to delete <strong>"{{ object.title }}"</strong>? This action cannot be undone.</p>
        
        <form method="post" style="display: flex; gap: 1rem;">
            {% csrf_token %}
            <a href="{% url 'job-detail' object.pk %}" class="btn btn-outline" style="flex: 1; text-align: center;">Cancel</a>
            <button type="submit" class="btn btn-danger" style="flex: 1;">Yes, delete</button>
        </form>
    </div>
</div>
{% endblock %}

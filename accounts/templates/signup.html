{% extends "base.html" %}
{% block title %}Sign Up | Job Portal{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="card" style="text-align: center;">
        <div style="background: var(--primary-light); width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 1.5rem auto; display: flex; align-items: center; justify-content: center; color: var(--primary);">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="8.5" cy="7" r="4"></circle>
                <line x1="20" y1="8" x2="20" y2="14"></line>
                <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
        </div>
        
        <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Create an account</h1>
        <p style="margin-bottom: 2rem;">Join us and find your dream job today.</p>
        
        <form method="post" class="form-container" style="text-align: left;">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn" style="width: 100%; margin-top: 1rem; padding: 0.875rem;">Sign Up</button>
        </form>
        
        <p style="margin-top: 2rem; font-size: 0.95rem;">
            Already have an account? <a href="{% url 'login' %}" style="font-weight: 600;">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
